services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: chale_admin
      POSTGRES_PASSWORD: chale_dev
      POSTGRES_DB: chale_alto_do_morro
    ports:
      - "5432:5432"
    volumes:
      - chale-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chale_admin -d chale_alto_do_morro"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  chale-pgdata: