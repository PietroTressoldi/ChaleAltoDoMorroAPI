<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Chalé Alto do Morro — Booking API</title>
  <desc id="desc">ASP.NET Core API behind a real chalet: bookings, calendar and cash book. Illustrative October calendar showing booked, pending and blocked nights, and a pre-reservation request returning 201.</desc>

  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#1a2e22"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#4a7a60" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="24" fill="#0b0d0c"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#c9a84c">ASP.NET CORE · .NET 10 · POSTGRESQL</text>
    <text x="62" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#faf8f4">Chalé Alto do Morro</text>
    <text x="62" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-style="italic" fill="#e8c97a">Booking API</text>
    <text x="64" y="280" font-size="22" fill="#f0ebe2">The back-end behind a real chalet:</text>
    <text x="64" y="310" font-size="22" fill="#f0ebe2">bookings, calendar and cash book — in production.</text>
    <text x="64" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7c7268">79 endpoints · JWT portal · Docker</text>
  </g>

  <g id="calendar" transform="translate(712 24)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="424" height="306" rx="18" fill="#131713" stroke="#2a4436" stroke-width="1.5"/>
    <text x="24" y="38" font-size="18" letter-spacing="2" fill="#faf8f4">OCT 2026</text>
    <g font-size="16" fill="#7c7268">
      <rect x="196" y="26" width="14" height="14" rx="3" fill="#c9a84c"/><text x="216" y="38">booked</text>
      <rect x="292" y="26" width="14" height="14" rx="3" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-dasharray="3 2"/><text x="312" y="38">pending</text>
    </g>
    <g font-size="16" fill="#7c7268" text-anchor="middle">
      <text x="45" y="72">S</text><text x="101" y="72">M</text><text x="157" y="72">T</text><text x="213" y="72">W</text><text x="269" y="72">T</text><text x="325" y="72">F</text><text x="381" y="72">S</text>
    </g>
    <!-- 7 colunas: x = 24 + col*56, largura 42; 5 linhas: y = 84 + row*44, altura 34 -->
    <g id="nights" font-size="16" text-anchor="middle">
      <!-- linha 1: 1–3 (qui–sáb) -->
      <rect x="248" y="84" width="42" height="34" rx="6" fill="#1a2e22"/><text x="269" y="106" fill="#f0ebe2">1</text>
      <rect x="304" y="84" width="42" height="34" rx="6" fill="#c9a84c"/><text x="325" y="106" fill="#0b0d0c">2</text>
      <rect x="360" y="84" width="42" height="34" rx="6" fill="#c9a84c"/><text x="381" y="106" fill="#0b0d0c">3</text>
      <!-- linha 2: 4–10 -->
      <rect x="24" y="128" width="42" height="34" rx="6" fill="#1a2e22"/><text x="45" y="150" fill="#f0ebe2">4</text>
      <rect x="80" y="128" width="42" height="34" rx="6" fill="#1a2e22"/><text x="101" y="150" fill="#f0ebe2">5</text>
      <rect x="136" y="128" width="42" height="34" rx="6" fill="url(#hatch)"/><text x="157" y="150" fill="#f0ebe2">6</text>
      <rect x="192" y="128" width="42" height="34" rx="6" fill="url(#hatch)"/><text x="213" y="150" fill="#f0ebe2">7</text>
      <rect x="248" y="128" width="42" height="34" rx="6" fill="#1a2e22"/><text x="269" y="150" fill="#f0ebe2">8</text>
      <rect x="304" y="128" width="42" height="34" rx="6" fill="#c9a84c"/><text x="325" y="150" fill="#0b0d0c">9</text>
      <rect x="360" y="128" width="42" height="34" rx="6" fill="#c9a84c"/><text x="381" y="150" fill="#0b0d0c">10</text>
      <!-- linha 3: 11–17 -->
      <rect x="24" y="172" width="42" height="34" rx="6" fill="#1a2e22"/><text x="45" y="194" fill="#f0ebe2">11</text>
      <rect x="80" y="172" width="42" height="34" rx="6" fill="#1a2e22"/><text x="101" y="194" fill="#f0ebe2">12</text>
      <rect x="136" y="172" width="42" height="34" rx="6" fill="#1a2e22"/><text x="157" y="194" fill="#f0ebe2">13</text>
      <rect x="192" y="172" width="42" height="34" rx="6" fill="#1a2e22"/><text x="213" y="194" fill="#f0ebe2">14</text>
      <rect x="248" y="172" width="42" height="34" rx="6" fill="#1a2e22"/><text x="269" y="194" fill="#f0ebe2">15</text>
      <rect x="305" y="173" width="40" height="32" rx="6" fill="none" stroke="#c9a84c" stroke-width="2" stroke-dasharray="5 3"/><text x="325" y="194" fill="#e8c97a">16</text>
      <rect x="361" y="173" width="40" height="32" rx="6" fill="none" stroke="#c9a84c" stroke-width="2" stroke-dasharray="5 3"/><text x="381" y="194" fill="#e8c97a">17</text>
      <!-- linha 4: 18–24 -->
      <rect x="24" y="216" width="42" height="34" rx="6" fill="#1a2e22"/><text x="45" y="238" fill="#f0ebe2">18</text>
      <rect x="80" y="216" width="42" height="34" rx="6" fill="#1a2e22"/><text x="101" y="238" fill="#f0ebe2">19</text>
      <rect x="136" y="216" width="42" height="34" rx="6" fill="#1a2e22"/><text x="157" y="238" fill="#f0ebe2">20</text>
      <rect x="192" y="216" width="42" height="34" rx="6" fill="#1a2e22"/><text x="213" y="238" fill="#f0ebe2">21</text>
      <rect x="248" y="216" width="42" height="34" rx="6" fill="#c9a84c"/><text x="269" y="238" fill="#0b0d0c">22</text>
      <rect x="304" y="216" width="42" height="34" rx="6" fill="#c9a84c"/><text x="325" y="238" fill="#0b0d0c">23</text>
      <rect x="360" y="216" width="42" height="34" rx="6" fill="#c9a84c"/><text x="381" y="238" fill="#0b0d0c">24</text>
      <!-- linha 5: 25–31 -->
      <rect x="24" y="260" width="42" height="34" rx="6" fill="#1a2e22"/><text x="45" y="282" fill="#f0ebe2">25</text>
      <rect x="80" y="260" width="42" height="34" rx="6" fill="#1a2e22"/><text x="101" y="282" fill="#f0ebe2">26</text>
      <rect x="136" y="260" width="42" height="34" rx="6" fill="#1a2e22"/><text x="157" y="282" fill="#f0ebe2">27</text>
      <rect x="192" y="260" width="42" height="34" rx="6" fill="#1a2e22"/><text x="213" y="282" fill="#f0ebe2">28</text>
      <rect x="248" y="260" width="42" height="34" rx="6" fill="#1a2e22"/><text x="269" y="282" fill="#f0ebe2">29</text>
      <rect x="304" y="260" width="42" height="34" rx="6" fill="#c9a84c"/><text x="325" y="282" fill="#0b0d0c">30</text>
      <rect x="360" y="260" width="42" height="34" rx="6" fill="#c9a84c"/><text x="381" y="282" fill="#0b0d0c">31</text>
    </g>
  </g>

  <g id="request" transform="translate(712 342)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <rect width="424" height="40" rx="20" fill="#1a2e22" stroke="#c9a84c" stroke-width="1.5"/>
    <text x="22" y="26" fill="#e8c97a">POST</text>
    <text x="78" y="26" fill="#faf8f4">/api/pre-reservations</text>
    <text x="402" y="26" text-anchor="end" fill="#c9a84c">201</text>
  </g>
</svg>
